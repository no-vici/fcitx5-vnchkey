[package]
name = "vncharkey-windows"
version = "0.3.3"
authors = ["VnCharKey Contributors"]
edition = "2021"
license = "GPL-3.0-or-later"
description = "VnCharKey - Modern, High-Performance Vietnamese Input Method Engine for Windows"

[workspace]

[[bin]]
name = "VnCharKey"
path = "src/main.rs"

[dependencies]
vnchkey-core = { path = "../crates/vnchkey-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
