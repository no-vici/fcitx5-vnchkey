name: Release Builds

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Package Debian/Ubuntu (.deb) and Arch (.tar.zst)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build extra-cmake-modules gcc g++ \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev \
            libxkbcommon-dev libgl1-mesa-dev libx11-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and Package .deb
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build & Package macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS App & DMG
        run: |
          cd macos
          make dmg

      - name: Upload macOS Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            macos/build/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

