[workspace]
members = [
    "crates/vnchkey-core",
    "crates/vnchkey-uinput",
    "crates/vnchkey-daemon",
    "crates/fcitx5-vnchkey-ffi",
    "crates/vnchkey-settings",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
authors = ["vnchKey Contributors <freedom@vnchkey.org>"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/no-vici/fcitx5-vnchkey"
description = "High-performance, memory-safe Vietnamese input engine and uinput daemon for Linux (vnchKey / Fcitx5 / Wayland / X11)"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
