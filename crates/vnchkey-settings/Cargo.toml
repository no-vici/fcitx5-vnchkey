[package]
name = "fcitx5-vnchkey-settings"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Native graphical configuration tool for Fcitx5 vnchKey written in 100% Rust"

[[bin]]
name = "fcitx5-vnchkey-settings"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
vnchkey-core = { path = "../vnchkey-core" }

